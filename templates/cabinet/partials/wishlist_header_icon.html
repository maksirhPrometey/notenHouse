{% load site_content %}
<span
  id="header-wishlist-icon"
  class="header-tool__icon-wrap{% if wishlist_count %} is-filled{% endif %}"
  hx-swap-oob="true"
>
  <span class="visually-hidden">
    {% block_plain 'site' 'header_tool_wishlist' %}{% if wishlist_count %}: {{ wishlist_count }}{% endif %}
  </span>
  <svg class="header-tool__icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    {% if wishlist_count %}
    <path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    {% else %}
    <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    {% endif %}
  </svg>
  <span
    class="header-tool__badge"
    {% if not wishlist_count %}hidden{% endif %}
    aria-hidden="true"
  >{{ wishlist_count }}</span>
</span>
