resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name notenhaus.com.ua www.notenhaus.com.ua _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name notenhaus.com.ua www.notenhaus.com.ua _;
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/notenhaus.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notenhaus.com.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    location = /healthz/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
